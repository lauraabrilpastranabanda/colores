<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="maqueta.css">
    <title>MAQUETA</title>
</head>
<body>
    <header>
        <h1>EXAMEN</h1>
    </header>
    <nav><h1>MENU </h1></nav>
    <main>
        <aside> 
            <a id="boton" href="maqueta01.html">BIOGRAFIA</a>
            <a id="boton" href="maqueta02.html">HOBBIES</a>
            <a id="boton" href="maqueta03.html">TABLA</a>
            <a id="boton" href="maqueta04.html">TIM</a>
            <a id="boton" href="maqueta05.html">CSS</a>
            <a id="boton" href="maqueta06.html">INFOGRAFÍA</a>
            <a id="boton" href="maqueta07.html">FORMULARIO</a>
        </aside>
        <section><center>
        <h1 style="color: brown;">FORMULARIO HTML</h1>
        <hr><br><br>
        
    </center>

<form id="miFormulario" action="#" method="GET">
        <input type="hidden" id="matricula" name="matricula" value="202698765">

        <table border="0" cellpadding="5">
            <tbody>
                <tr>
                    <td><label for="nombre">Nombre:</label></td>
                    <td><input type="text" id="nombre" name="nombre" required></td>
                </tr>

                <tr>
                    <td><label for="apellidos">Apellidos:</label></td>
                    <td><input type="text" id="apellidos" name="apellidos" required></td>
                </tr>

                <tr>
                    <td><label for="correo">Correo electrónico:</label></td>
                    <td><input type="email" id="correo" name="correo" required></td>
                </tr>

                <tr>
                    <td><label for="telefono">Teléfono:</label></td>
                    <td><input type="tel" id="telefono" name="telefono"></td>
                </tr>

                <tr>
                    <td><label>Fecha de Nacimiento:</label></td>
                    <td>
                        <select name="dia" aria-label="Día" required>
                            <option value="">Día</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                            <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                            <option value="13">13</option><option value="14">14</option><option value="15">15</option>
                            <option value="16">16</option><option value="17">17</option><option value="18">18</option>
                            <option value="19">19</option><option value="20">20</option><option value="21">21</option>
                            <option value="22">22</option><option value="23">23</option><option value="24">24</option>
                            <option value="25">25</option><option value="26">26</option><option value="27">27</option>
                            <option value="28">28</option><option value="29">29</option><option value="30">30</option>
                            <option value="31">31</option>
                        </select>

                        <select name="mes" aria-label="Mes" required>
                            <option value="">Mes</option>
                            <option value="1">Enero</option><option value="2">Febrero</option>
                            <option value="3">Marzo</option><option value="4">Abril</option>
                            <option value="5">Mayo</option><option value="6">Junio</option>
                            <option value="7">Julio</option><option value="8">Agosto</option>
                            <option value="9">Septiembre</option><option value="10">Octubre</option>
                            <option value="11">Noviembre</option><option value="12">Diciembre</option>
                        </select>

                        <select name="anio" aria-label="Año" required>
                            <option value="">Año</option>
                            <option value="2000">2000</option><option value="2001">2001</option>
                            <option value="2002">2002</option><option value="2003">2003</option>
                            <option value="2004">2004</option><option value="2005">2005</option>
                            <option value="2006">2006</option><option value="2007">2007</option>
                            <option value="2008">2008</option><option value="2009">2009</option>
                            <option value="2010">2010</option><option value="2011">2011</option>
                            <option value="2012">2012</option><option value="2013">2013</option>
                            <option value="2014">2014</option><option value="2015">2015</option>
                            <option value="2016">2016</option><option value="2017">2017</option>
                            <option value="2018">2018</option><option value="2019">2019</option>

                            
                    </td>
                </tr>

                <tr>
                    <td><label for="facebook">Link de Facebook:</label></td>
                    <td><input type="url" id="facebook" name="facebook"></td>
                </tr>

                <tr>
                    <td><label for="contrasena">Contraseña:</label></td>
                    <td><input type="password" id="contrasena" name="contrasena" required></td>
                </tr>

                <tr>
                    <td><label for="observaciones">Observaciones:</label></td>
                    <td><textarea id="observaciones" name="observaciones" rows="4" cols="40"></textarea></td>
                </tr>

                <tr>
                    <td><label for="hermanos">Número de Hermanos:</label></td>
                    <td><input type="number" id="hermanos" name="hermanos" min="0"></td>
                </tr>

                <tr>
                    <td><label for="genero">Género:</label></td>
                    <td>
                        <select id="genero" name="genero">
                            <option value="">Selecciona una opción</option>
                            <option value="femenino">Femenino</option>
                            <option value="masculino">Masculino</option>
                            <option value="otro">Otro</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="semestre">Semestre:</label></td>
                    <td>
                        <select id="semestre" name="semestre">
                            <option value="">Selecciona tu semestre</option>
                            <option value="1">1° Semestre</option>
                            <option value="2">2° Semestre</option>
                            <option value="3">3° Semestre</option>
                            <option value="4">4° Semestre</option>
                            <option value="5">5° Semestre</option>
                            <option value="6">6° Semestre</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="carrera">Carrera:</label></td>
                    <td>
                        <input list="carreras" id="carrera" name="carrera">
                        <datalist id="carreras">
                            <option value="Logistica">
                            <option value="Ventas">
                            <option value="Programación">
                            <option value="Maquinas y Herramientas">
                        </datalist>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <button type="button" onclick="if(document.getElementById('miFormulario').checkValidity()) { alert('Gracias por contestar el cuentionario'); window.location.href = window.location.pathname; } else { document.getElementById('miFormulario').reportValidity(); }">Enviar</button>
                        <button type="reset">Borrar (Reset)</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </form></section>
    </main>
    <footer><h1>LAURA ABRIL PASTRANA BANDA</h1></footer>
</body>
</html>
